<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450" width="430" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      .window {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1px;
        rx: 10px;
      }

      .header {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }

      .footer {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }

      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      .header-title {
        fill: #8b949e;
        font-size: 11.5px;
        font-weight: 600;
      }

      .shell-badge {
        fill: #58a6ff;
        font-size: 10px;
        font-weight: 600;
      }

      .user-host {
        fill: #39d353;
        font-size: 13px;
        font-weight: 700;
      }

      .hr-line {
        stroke: #30363d;
        stroke-width: 1px;
      }

      .field-key {
        font-size: 10.5px;
        font-weight: 700;
        fill: #39d353;
      }

      .field-val {
        font-size: 10px;
        font-weight: 400;
        fill: #c9d1d9;
      }

      .section-title {
        font-size: 11px;
        font-weight: 700;
        fill: #58a6ff;
        letter-spacing: 0.5px;
      }

      .proj-name {
        font-size: 10px;
        font-weight: 600;
        fill: #79c0ff;
      }

      .proj-desc {
        font-size: 9.5px;
        font-weight: 400;
        fill: #8b949e;
      }

      @keyframes reveal {
        0% {
          opacity: 0;
          transform: translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .anim-row {
        opacity: 0;
        animation: reveal 0.15s ease-out forwards;
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blinkCursor 1.1s infinite;
        fill: #39d353;
      }
    </style>

    <clipPath id="infoCardHeaderClip">
      <rect x="0" y="0" width="430" height="32" rx="10" />
    </clipPath>
    <clipPath id="infoCardFooterClip">
      <rect x="0" y="426" width="430" height="24" rx="10" />
    </clipPath>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="window" x="0.5" y="0.5" width="429" height="449" />

  <!-- Header Bar -->
  <g clip-path="url(#infoCardHeaderClip)">
    <rect class="header" x="0" y="0" width="430" height="32" />
    <line x1="0" y1="32" x2="430" y2="32" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Window Buttons -->
  <circle cx="18" cy="16" r="5" fill="#ff5f56" />
  <circle cx="34" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="16" r="5" fill="#27c93f" />

  <!-- Window Title -->
  <text class="mono header-title" x="215" y="20" text-anchor="middle">charan@svit: ~ (neofetch)</text>
  <text class="mono shell-badge" x="414" y="20" text-anchor="end">zsh 5.9</text>

  <!-- Neofetch Content Body -->
  <g transform="translate(22, 48)">
    <!-- User @ Host Banner -->
    <g class="anim-row" style="animation-delay: 0.05s;">
      <text class="mono user-host" x="0" y="10">charan<tspan fill="#8b949e">@</tspan><tspan fill="#58a6ff">svit</tspan></text>
      <line class="hr-line" x1="0" y1="16" x2="160" y2="16" />
    </g>
    <g class="anim-row" style="animation-delay: 0.080s;">
      <text class="mono field-key" x="0" y="32.0">OS:</text>
      <text class="mono field-val" x="84" y="32.0" fill="#58a6ff">Arch Linux / macOS Darwin</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.110s;">
      <text class="mono field-key" x="0" y="48.5">Host:</text>
      <text class="mono field-val" x="84" y="48.5" fill="#f0883e">Sai Vidya Institute of Technology (SVIT)</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.140s;">
      <text class="mono field-key" x="0" y="65.0">Name:</text>
      <text class="mono field-val" x="84" y="65.0" fill="#58a6ff">Charan Gowda M D</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.170s;">
      <text class="mono field-key" x="0" y="81.5">Role:</text>
      <text class="mono field-val" x="84" y="81.5" fill="#bc8cff">Computer Science Engineering Student</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.200s;">
      <text class="mono field-key" x="0" y="98.0">Interests:</text>
      <text class="mono field-val" x="84" y="98.0" fill="#39d353">Software Eng • Backend Dev • AI/ML</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.230s;">
      <text class="mono field-key" x="0" y="114.5">Open Source:</text>
      <text class="mono field-val" x="84" y="114.5" fill="#79c0ff">Apache Maven Contributor</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.260s;">
      <text class="mono field-key" x="0" y="131.0">Focus:</text>
      <text class="mono field-val" x="84" y="131.0" fill="#56d364">Building systems &amp; contributing to OSS</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.290s;">
      <text class="mono field-key" x="0" y="147.5">Languages:</text>
      <text class="mono field-val" x="84" y="147.5" fill="#d2a8ff">Python • Java • C • Go • SQL</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.320s;">
      <text class="mono field-key" x="0" y="164.0">Tools:</text>
      <text class="mono field-val" x="84" y="164.0" fill="#7ee787">Git • Docker • Linux • Maven • GH Actions</text>
    </g>

    <!-- Projects Section -->
    <g class="anim-row" style="animation-delay: 0.38s;">
      <text class="mono section-title" x="0" y="190.5">PROJECTS &amp; ACHIEVEMENTS</text>
      <line class="hr-line" x1="0" y1="196.5" x2="386" y2="196.5" />
    </g>
    <g class="anim-row" style="animation-delay: 0.400s;">
      <circle cx="4" cy="207.0" r="2" fill="#39d353" />
      <text class="mono proj-name" x="12" y="210.5">Salamander:</text>
      <text class="mono proj-desc" x="110" y="210.5">Coding challenge &amp; interview prep platform</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.430s;">
      <circle cx="4" cy="224.0" r="2" fill="#39d353" />
      <text class="mono proj-name" x="12" y="227.5">BEL Blockchain:</text>
      <text class="mono proj-desc" x="110" y="227.5">Defense Blockchain Secure Platform MVP</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.460s;">
      <circle cx="4" cy="241.0" r="2" fill="#39d353" />
      <text class="mono proj-name" x="12" y="244.5">Apache Maven:</text>
      <text class="mono proj-desc" x="110" y="244.5">Core pull requests &amp; community contribution</text>
    </g>
    <g class="anim-row" style="animation-delay: 0.490s;">
      <circle cx="4" cy="258.0" r="2" fill="#39d353" />
      <text class="mono proj-name" x="12" y="261.5">OSS Club SVIT:</text>
      <text class="mono proj-desc" x="110" y="261.5">Official platform &amp; developer community</text>
    </g>

    <!-- ANSI Terminal Color Blocks -->
    <g class="anim-row" style="animation-delay: 0.55s;" transform="translate(0, 292.5)">
      <rect x="0" y="0" width="22" height="10" rx="3" fill="#484f58" />
      <rect x="28" y="0" width="22" height="10" rx="3" fill="#ff7b72" />
      <rect x="56" y="0" width="22" height="10" rx="3" fill="#3fb950" />
      <rect x="84" y="0" width="22" height="10" rx="3" fill="#d29922" />
      <rect x="112" y="0" width="22" height="10" rx="3" fill="#58a6ff" />
      <rect x="140" y="0" width="22" height="10" rx="3" fill="#bc8cff" />
      <rect x="168" y="0" width="22" height="10" rx="3" fill="#39c5cf" />
      <rect x="196" y="0" width="22" height="10" rx="3" fill="#b1bac4" />
    </g>
  </g>

  <!-- Terminal Status Footer -->
  <g clip-path="url(#infoCardFooterClip)">
    <rect class="footer" x="0" y="426" width="430" height="24" />
    <line x1="0" y1="426" x2="430" y2="426" stroke="#30363d" stroke-width="1" />
  </g>

  <g transform="translate(14, 442)">
    <text class="mono" x="0" y="0" font-size="9.5px" fill="#8b949e">
      <tspan fill="#39d353">charan@svit:~$</tspan> echo $ENGINEER_GOALS <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>