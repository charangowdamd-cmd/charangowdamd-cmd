<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 450" width="410" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

      .window {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1px;
        rx: 10px;
      }

      .header {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }

      .status-bar {
        fill: #161b22;
        stroke: #30363d;
        stroke-width: 1px;
      }

      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }

      .header-title {
        fill: #8b949e;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge {
        fill: #58a6ff;
        font-size: 10px;
        font-weight: 600;
      }

      .status-text {
        fill: #8b949e;
        font-size: 9.5px;
        font-weight: 500;
      }

      .status-accent {
        fill: #39d353;
        font-weight: 700;
      }

      .ascii-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-size: 9.8px;
        font-weight: 600;
        fill: #39d353;
        letter-spacing: 0.8px;
        filter: drop-shadow(0 0 1.5px rgba(57, 211, 83, 0.4));
        white-space: pre;
      }

      @keyframes revealLine {
        0% {
          opacity: 0;
          transform: translateY(-2px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .term-line {
        opacity: 0;
        animation: revealLine 0.15s ease-out forwards;
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blinkCursor 1.1s infinite;
        fill: #39d353;
      }

      .scanline {
        background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.2));
      }
    </style>

    <clipPath id="asciiHeaderClip">
      <rect x="0" y="0" width="410" height="32" rx="10" />
    </clipPath>
    <clipPath id="asciiFooterClip">
      <rect x="0" y="426" width="410" height="24" rx="10" />
    </clipPath>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="window" x="0.5" y="0.5" width="409" height="449" />

  <!-- Header Bar -->
  <g clip-path="url(#asciiHeaderClip)">
    <rect class="header" x="0" y="0" width="410" height="32" />
    <line x1="0" y1="32" x2="410" y2="32" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Window Buttons -->
  <circle cx="18" cy="16" r="5" fill="#ff5f56" />
  <circle cx="34" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="16" r="5" fill="#27c93f" />

  <!-- Window Title -->
  <text class="mono header-title" x="205" y="20" text-anchor="middle">charan@terminal: ~/portrait.asc</text>
  <text class="mono badge" x="394" y="20" text-anchor="end">UTF-8</text>

  <!-- ASCII Art Lines with Typing / Line-by-Line Staggered Animation -->
  <g class="ascii-text">
    <text class="term-line" x="82" y="60.0" style="animation-delay: 0.080s;">               ***++++=----=              </text>
    <text class="term-line" x="82" y="71.2" style="animation-delay: 0.118s;">             %%#######**+==---            </text>
    <text class="term-line" x="82" y="82.4" style="animation-delay: 0.156s;">            ##############*=---           </text>
    <text class="term-line" x="82" y="93.6" style="animation-delay: 0.194s;">          ####%%%##########*=----         </text>
    <text class="term-line" x="82" y="104.8" style="animation-delay: 0.232s;">         ###################=-----        </text>
    <text class="term-line" x="82" y="116.0" style="animation-delay: 0.270s;">         *++++++*****+**###*------        </text>
    <text class="term-line" x="82" y="127.2" style="animation-delay: 0.308s;">        ++==========-===+*##=:-----       </text>
    <text class="term-line" x="82" y="138.4" style="animation-delay: 0.346s;">        +====----------===*#=:-----       </text>
    <text class="term-line" x="82" y="149.6" style="animation-delay: 0.384s;">        +==---:::::::---==*#=::::::       </text>
    <text class="term-line" x="82" y="160.8" style="animation-delay: 0.422s;">       +++**+=----=+++==+=+#+:::::::      </text>
    <text class="term-line" x="82" y="172.0" style="animation-delay: 0.460s;">        ++=====-====*=====+#=::::::       </text>
    <text class="term-line" x="82" y="183.2" style="animation-delay: 0.498s;">        ++=-==+-====+===-=+=---::::       </text>
    <text class="term-line" x="82" y="194.4" style="animation-delay: 0.536s;">        ====++=--==-=----==----::::       </text>
    <text class="term-line" x="82" y="205.6" style="animation-delay: 0.574s;">         -==+==::-=------------:::        </text>
    <text class="term-line" x="82" y="216.8" style="animation-delay: 0.612s;">         -==++=------:::-----:::::        </text>
    <text class="term-line" x="82" y="228.0" style="animation-delay: 0.650s;">          +=+++===-------===-::::         </text>
    <text class="term-line" x="82" y="239.2" style="animation-delay: 0.688s;">          +++==--=====--==++-::::         </text>
    <text class="term-line" x="82" y="250.4" style="animation-delay: 0.726s;">        =====----------==---:::::::       </text>
    <text class="term-line" x="82" y="261.6" style="animation-delay: 0.764s;">      :++=======-----===:::::::::::::     </text>
    <text class="term-line" x="82" y="272.8" style="animation-delay: 0.802s;">    :::-+++===-----=+====::::::::::::::   </text>
    <text class="term-line" x="82" y="284.0" style="animation-delay: 0.840s;">  :::::=++**+++======-=**=:....:::::::::: </text>
    <text class="term-line" x="82" y="295.2" style="animation-delay: 0.878s;">:::::-*#+=++++++==---=*#**+==--::.::::::::</text>
    <text class="term-line" x="82" y="306.4" style="animation-delay: 0.916s;">:..:+##**+=====---==++******####*-:..:::::</text>
    <text class="term-line" x="82" y="317.6" style="animation-delay: 0.954s;">:-=*****+++========++**##****####*+==+++=-</text>
    <text class="term-line" x="82" y="328.8" style="animation-delay: 0.992s;">*####*+*+++==========+**##*****##*+*#####*</text>
    <text class="term-line" x="82" y="340.0" style="animation-delay: 1.030s;">#**+=+**+++==----::.-******######**#######</text>
    <text class="term-line" x="82" y="351.2" style="animation-delay: 1.068s;">**+:.+*-.::........:***#**#####%####**####</text>
    <text class="term-line" x="82" y="362.4" style="animation-delay: 1.106s;">#*=.:+*............+*###**####*##*****####</text>
    <text class="term-line" x="82" y="373.6" style="animation-delay: 1.144s;">**:.:*+...........-**+*#***##***#+****#*##</text>
    <text class="term-line" x="82" y="384.8" style="animation-delay: 1.182s;">*=..:++..........:+*==##***##******#**#*##</text>
    <text class="term-line" x="82" y="396.0" style="animation-delay: 1.220s;">*=..:*=..........-++-+#****#*******#****#*</text>
  </g>

  <!-- Terminal Status Bar -->
  <g clip-path="url(#asciiFooterClip)">
    <rect class="status-bar" x="0" y="426" width="410" height="24" />
    <line x1="0" y1="426" x2="410" y2="426" stroke="#30363d" stroke-width="1" />
  </g>

  <g transform="translate(14, 442)">
    <text class="mono status-text" x="0" y="0">
      <tspan class="status-accent">[RENDERED]</tspan> portrait.asc
    </text>
    <text class="mono status-text" x="382" y="0" text-anchor="end">
      31L, 100% <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>