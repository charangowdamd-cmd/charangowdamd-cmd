name: Refresh Profile README Assets

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

# Minimum required permissions
permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch contributions & regenerate SVG assets
        run: |
          python scripts/update_profile.py "${{ github.repository_owner }}"

      - name: Commit and push if changes exist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in generated assets."
          else
            git commit -m "chore(profile): update contribution heatmap and stats [skip ci]"
            git push
          fi
